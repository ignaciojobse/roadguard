# Configuracion de camara de RoadGuard (RF1): MVI_40243.
#
# Generado por scripts/calibrar_ua_detrac.py; no editar a mano, cambiar los
# puntos en el script y volver a generarlo.
#
# Calibracion (M3, RF4): homografia desde dos lineas discontinuas de
# 6 m de trazo y 9 m de hueco, separadas por un carril de
# 3.75 m. Ejes: x en el sentido de avance, y lateral, en metros.
#   Error de reproyeccion: RMSE 0.15 m, maximo 0.24 m.
#   Desfase entre los trazos de las dos lineas: 2.11 m.
#   Camara implicita: focal 570 px, inconsistencia 0.00.
# Estado de cada dato:
#   Confirmada: escala y patron de 6/9 m (la linea C, no usada, cae a 7,4-7,8 m
#     y sus trazos miden 5,8 y 9,5 m) y 63 km/h de mediana para los autos del XML.
#   Candidata a validar: ancho de carril de 3,75 m (norma de via rapida).
# Los umbrales NO constituyen limites legales (seccion 1.1).

camara:
  nombre: MVI_40243
  descripcion: >-
    UA-DETRAC entrenamiento, nublado, camara fija sobre una autopista urbana. Calzada derecha, entre el bandejon central y la orilla; el trafico se aleja de la camara (de abajo hacia arriba en la imagen).

# Region de interes: poligono en coordenadas de imagen (px), x de -5 a
# 70 m y todo el ancho de la calzada.
region_interes:
  - [215.4, 474.1]
  - [780.3, 109.8]
  - [939.4, 110.9]
  - [1525.5, 1282.8]

# Carriles: poligonos en px, construidos desde sus bordes en metros
# [-4.1, 0.0, 3.75, 7.5, 11.25]. Carril 0 junto al bandejon central.
carriles:
  - indice: 0
    poligono:
      - [215.4, 474.1]
      - [780.3, 109.8]
      - [819, 110.1]
      - [350.3, 557.4]
  - indice: 1
    poligono:
      - [350.3, 557.4]
      - [819, 110.1]
      - [856.6, 110.3]
      - [540.3, 674.6]
  - indice: 2
    poligono:
      - [540.3, 674.6]
      - [856.6, 110.3]
      - [896.7, 110.6]
      - [862, 873.2]
  - indice: 3
    poligono:
      - [862, 873.2]
      - [896.7, 110.6]
      - [939.4, 110.9]
      - [1525.5, 1282.8]

# Correspondencias imagen <-> camino (metros).
homografia:
  puntos_imagen:
    - [506.2, 411.2]
    - [600.9, 319]
    - [684.8, 237.8]
    - [715, 208]
    - [685.1, 410.7]
    - [739.6, 317.4]
    - [786.9, 236.4]
    - [804.3, 205.6]
