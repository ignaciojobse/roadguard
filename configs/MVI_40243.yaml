# Clases vehiculares a detectar (RF2).
clases:
  - automovil
  - bus
  - camion
  - motocicleta

confianza_min_deteccion: 0.25
# Confianza de carril (1 en el centro, 0 en la linea) que cuenta para
# confirmar o cancelar un cambio. 0,3 es el mejor F1 de reglas sobre NGSIM
# degradado y sobre MVI_39271 (evaluacion del 18-nov; con 0,6 M3 confirmaba
# la mitad de los cambios reales).
confianza_min_carril: 0.30

# Paso 4: segundos de permanencia estable en el nuevo carril antes de
# confirmar un cambio completo. Las oscilaciones sobre la linea no cuentan.
permanencia_cambio_carril: 1.0

# Umbrales de las reglas (RF7-RF11). Valores de la propuesta.
umbrales:
  # RF7 - Cercania peligrosa
  cercania_velocidad_min: 5.0      # m/s
  cercania_thw_max: 1.5            # s
  cercania_persistencia: 2.0       # s
  # Interrupcion (oclusion breve) que no corta el tramo: con 0 un mismo
  # episodio salia partido en dos. 1,5 s cubre el hueco medio medido (0,9 s).
  cercania_tolerancia_interrupcion: 1.5   # s

  # RF8 - Zigzag
  zigzag_cambios_min: 2
  zigzag_ventana: 10.0             # s

  # RF9 - Corte de carril
  corte_ventana_post_cambio: 2.0   # s
  corte_thw_max: 1.5               # s
  corte_ttc_max: 3.0               # s

  # RF10 - Puntaje de riesgo
  aporte_cercania: 40
  aporte_zigzag: 35
  aporte_corte: 50
  puntaje_maximo: 100
  vigencia_aporte: 5.0             # s

  # RF11 - Bandas de color
  banda_verde_max: 29
  banda_amarillo_max: 59
