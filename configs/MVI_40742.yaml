# Configuracion de camara de RoadGuard (RF1): MVI_40742.
#
# Generado por scripts/calibrar_ua_detrac.py; no editar a mano, cambiar los
# puntos en el script y volver a generarlo.
#
# Sin calibracion (M3, RF4, Paso 5): no hay homografia. Region y carriles
# son rayos desde el punto de fuga (-278.0, 91.0) con pendientes [0.335, 0.452, 0.625].
# Estado de cada dato:
#   Sin calibracion: distancia, THW y TTC no disponibles y sin eventos de
#     cercania ni corte (Paso 5). Se evalua percepcion y carril.
#   Confirmada: dos carriles; los vehiculos del XML se agrupan a cada lado
#     de la linea continua central y ninguno pisa la banquina.
# Los umbrales NO constituyen limites legales (seccion 1.1).

camara:
  nombre: MVI_40742
  descripcion: >-
    UA-DETRAC prueba, anochecer, camara fija. Calzada cercana, entre la baranda central y la baranda de la vereda; el trafico avanza de izquierda a derecha, acercandose a la camara. Buses detenidos tapan la calzada casi todo el clip.

# Region de interes: poligono en coordenadas de imagen (px), entre los
# bordes exteriores de la calzada y todo el ancho de la imagen.
region_interes:
  - [0, 184.1]
  - [960, 505.7]
  - [960, 864.8]
  - [0, 264.8]

# Carriles: poligonos en px entre rayos consecutivos. Carril 0 junto a la baranda central.
carriles:
  - indice: 0
    poligono:
      - [0, 184.1]
      - [960, 505.7]
      - [960, 650.6]
      - [0, 216.7]
  - indice: 1
    poligono:
      - [0, 216.7]
      - [960, 650.6]
      - [960, 864.8]
      - [0, 264.8]

# Clases vehiculares a detectar (RF2).
clases:
  - automovil
  - bus
  - camion
  - motocicleta

confianza_min_deteccion: 0.25
confianza_min_carril: 0.60

# Paso 4: segundos de permanencia estable en el nuevo carril antes de
# confirmar un cambio completo. Las oscilaciones sobre la linea no cuentan.
permanencia_cambio_carril: 1.0

# Umbrales de las reglas (RF7-RF11). Valores de la propuesta.
umbrales:
  # RF7 - Cercania peligrosa
  cercania_velocidad_min: 5.0      # m/s
  cercania_thw_max: 1.5            # s
  cercania_persistencia: 2.0       # s

  # RF8 - Zigzag
  zigzag_cambios_min: 2
  zigzag_ventana: 10.0             # s

  # RF9 - Corte de carril
  corte_ventana_post_cambio: 2.0   # s
  corte_thw_max: 1.5               # s
  corte_ttc_max: 3.0               # s

  # RF10 - Puntaje de riesgo
  aporte_cercania: 40
  aporte_zigzag: 35
  aporte_corte: 50
  puntaje_maximo: 100
  vigencia_aporte: 5.0             # s

  # RF11 - Bandas de color
  banda_verde_max: 29
  banda_amarillo_max: 59
