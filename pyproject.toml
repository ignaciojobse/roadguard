[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadguard"
version = "0.1.0"
description = "Prototipo de apoyo para detectar patrones de conduccion potencialmente riesgosa en video de camaras fijas"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
